<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book of the Dead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="quest-panel">
  <div id="room-title"></div>
  <div id="objective-text"></div>
</div>

<div id="ushabti-speech">
  <div class="speech-speaker">The Ushabti Speaks</div>
  <div class="speech-text" id="ushabti-speech-text"></div>
</div>

<div id="ui"></div>
<div id="map-panel" class="hidden"></div>
<div id="glyph-panel" class="hidden"></div>

<div id="inventory-grid">
  <div class="slot" data-index="0"></div>
  <div class="slot" data-index="1"></div>
  <div class="slot" data-index="2"></div>
  <div class="slot" data-index="3"></div>
  <div class="slot" data-index="4"></div>
  <div class="slot" data-index="5"></div>
</div>

<div id="help-text"></div>

<script src="state.js"></script>
<script src="rooms.js"></script>
<script src="ui.js"></script>
<script src="inventory.js"></script>
<script src="objectives.js"></script>
<script src="engine.js"></script>
</body>
</html>
