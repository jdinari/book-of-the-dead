<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book of the Dead — Tomb</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="game"></canvas>

<div id="quest-panel">
  <div id="room-title"></div>
  <div id="objective-text"></div>
</div>

<div id="ui"></div>

<div id="map-panel" class="hidden"></div>
<div id="glyph-panel" class="hidden"></div>

<div id="inventory-grid">
  <div class="slot" data-index="0"></div>
  <div class="slot" data-index="1"></div>
  <div class="slot" data-index="2"></div>
  <div class="slot" data-index="3"></div>
  <div class="slot" data-index="4"></div>
  <div class="slot" data-index="5"></div>
</div>

<div id="help-text"></div>

<!--
  Load order matters:
  1. state.js    — shared variables, canvas, flags
  2. rooms.js    — room data + helpers (needs state)
  3. ui.js       — display functions (needs state + rooms)
  4. inventory.js — item management (needs state + ui)
  5. objectives.js — quest logic (needs all above)
  6. engine.js   — game loop, input, drawing (needs everything)
-->
<script src="state.js"></script>
<script src="rooms.js"></script>
<script src="ui.js"></script>
<script src="inventory.js"></script>
<script src="objectives.js"></script>
<script src="engine.js"></script>

</body>
</html>
