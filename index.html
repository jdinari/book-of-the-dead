<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tomb Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="game-world">

    <!-- Tomb room -->
    <div id="tomb">

      <div class="wall"></div>
      <div class="floor"></div>

      <!-- Sarcophagus -->
      <div class="object sarcophagus"></div>

      <!-- Ushabti statues -->
      <div class="object ushabti" style="left: 100px; top: 250px;"></div>
      <div class="object ushabti" style="left: 500px; top: 220px;"></div>

      <!-- Player -->
      <div id="player"></div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
